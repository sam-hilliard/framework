name: Semgrep Security Scan

on: workflow_dispatch

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan PHP
        run: |
          semgrep scan \
            --config p/php \
            --error \
            ./src
